syntax = "proto3";
package eye.v1;

option go_package = "github.com/eye/eye/gen/go/eyev1";

service Collector {
  rpc CreateSession (CreateSessionRequest) returns (CreateSessionResponse);
  rpc Ingest (IngestRequest) returns (IngestResponse);
  rpc IngestStream (stream IngestRequest) returns (IngestResponse);
  rpc QueryStream (QueryStreamRequest) returns (stream QueryStreamResponse);
  rpc LiveCounters (LiveCountersRequest) returns (stream LiveCountersResponse);
}

message CreateSessionRequest { string tenant_id = 1; }
message CreateSessionResponse { string session_id = 1; int64 expires_at = 2; }

message Event {
  string event_id = 1;
  string event_name = 2;
  int64 client_ts = 3;
  bytes payload = 4;
  map<string,string> dims = 5;
  string session_id = 6;
  string source = 7; // client | system
  bool is_aggregated = 8;
  string aggregation_id = 9;
}

message IngestRequest {
  repeated Event events = 1;
}

message IngestResponse {
  int32 accepted = 1;
  int32 rejected = 2;
}

// QueryStreamRequest mirrors service.EventFilter's filters plus a page size
// used to chunk the streamed response.
message QueryStreamRequest {
  string tenant_id = 1;
  string session_id = 2;
  string event_name = 3;
  int64 from_ts = 4; // 0 means unbounded
  int64 to_ts = 5;   // 0 means unbounded
  string dims_contains = 6;
  int32 page_size = 7; // defaults to 100 if <= 0
}

// QueryStreamResponse carries one page (batch) of matching events.
message QueryStreamResponse {
  repeated Event events = 1;
}

// LiveCountersRequest asks for a live-updating running event count for one
// tenant. The server sends an immediate snapshot, then one message per
// subsequent ingested event for that tenant until the client disconnects.
message LiveCountersRequest {
  string tenant_id = 1;
}

message LiveCountersResponse {
  int64 count = 1;
}

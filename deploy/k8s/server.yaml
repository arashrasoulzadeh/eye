apiVersion: v1
kind: Secret
metadata: { name: eye-server-secrets, namespace: eye }
type: Opaque
stringData: { ADMIN_KEY: replace-me, API_KEY_SALT: replace-me }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: eye-data, namespace: eye }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: eye-server, namespace: eye }
spec:
  replicas: 1
  selector: { matchLabels: { app: eye-server } }
  template:
    metadata: { labels: { app: eye-server } }
    spec:
      containers:
        - name: server
          image: ghcr.io/arashrasoulzadeh/eye-server:latest
          ports: [{ name: http, containerPort: 8080 }, { name: grpc, containerPort: 50052 }]
          env:
            - { name: EYE_ENV, value: production }
            - { name: DB_PATH, value: /data/eye.db }
            - { name: SNAPSHOT_DIR, value: /data/snapshots }
            - { name: ADMIN_KEY, valueFrom: { secretKeyRef: { name: eye-server-secrets, key: ADMIN_KEY } } }
            - { name: API_KEY_SALT, valueFrom: { secretKeyRef: { name: eye-server-secrets, key: API_KEY_SALT } } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: eye-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: eye-server, namespace: eye }
spec:
  selector: { app: eye-server }
  ports: [{ name: http, port: 8080, targetPort: http }, { name: grpc, port: 50052, targetPort: grpc }]

apiVersion: apps/v1
kind: Deployment
metadata: { name: eye-admin, namespace: eye }
spec:
  replicas: 1
  selector: { matchLabels: { app: eye-admin } }
  template:
    metadata: { labels: { app: eye-admin } }
    spec:
      containers:
        - name: admin
          image: ghcr.io/arashrasoulzadeh/eye-admin:latest
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: BACKEND_URL, value: http://eye-server:8080 }
            - { name: ADMIN_API_KEY, valueFrom: { secretKeyRef: { name: eye-server-secrets, key: ADMIN_KEY } } }
            - { name: OIDC_ISSUER, valueFrom: { secretKeyRef: { name: eye-oidc-secrets, key: ISSUER, optional: true } } }
            - { name: OIDC_CLIENT_ID, valueFrom: { secretKeyRef: { name: eye-oidc-secrets, key: CLIENT_ID, optional: true } } }
            - { name: OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: eye-oidc-secrets, key: CLIENT_SECRET, optional: true } } }
            - { name: OIDC_REDIRECT_URI, valueFrom: { secretKeyRef: { name: eye-oidc-secrets, key: REDIRECT_URI, optional: true } } }
            - { name: OIDC_ALLOWED_EMAILS, valueFrom: { secretKeyRef: { name: eye-oidc-secrets, key: ALLOWED_EMAILS, optional: true } } }
            - { name: NEXT_PUBLIC_OIDC_ENABLED, valueFrom: { configMapKeyRef: { name: eye-admin-config, key: OIDC_ENABLED, optional: true } } }
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: eye-admin, namespace: eye }
spec:
  selector: { app: eye-admin }
  ports: [{ name: http, port: 3000, targetPort: http }]

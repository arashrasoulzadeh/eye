apiVersion: apps/v1
kind: Deployment
metadata: { name: eye-collector, namespace: eye }
spec:
  replicas: 2
  selector: { matchLabels: { app: eye-collector } }
  template:
    metadata: { labels: { app: eye-collector } }
    spec:
      containers:
        - name: collector
          image: ghcr.io/arashrasoulzadeh/eye-collector:latest
          ports: [{ name: grpc, containerPort: 50051 }]
          env:
            - { name: EYE_API_URL, value: http://eye-server:8080 }
---
apiVersion: v1
kind: Service
metadata: { name: eye-collector, namespace: eye }
spec:
  selector: { app: eye-collector }
  ports: [{ name: grpc, port: 50051, targetPort: grpc }]

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ include "eye.fullname" . }} }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.adminHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "eye.fullname" . }}-admin, port: { number: 3000 } } } }] }
    - host: {{ .Values.ingress.apiHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "eye.fullname" . }}-server, port: { number: 8080 } } } }] }
{{- end }}

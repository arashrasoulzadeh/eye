apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eye.fullname" . }}
type: Opaque
stringData:
  ADMIN_KEY: {{ required "server.adminKey is required" .Values.server.adminKey | quote }}
  API_KEY_SALT: {{ required "server.apiKeySalt is required" .Values.server.apiKeySalt | quote }}
  DATABASE_URL: {{ if .Values.dependencies.postgres.enabled }}"postgres://{{ .Values.dependencies.postgres.user }}:{{ .Values.dependencies.postgres.password }}@{{ include "eye.fullname" . }}-postgres:5432/{{ .Values.dependencies.postgres.database }}?sslmode=disable"{{ else }}{{ .Values.server.databaseURL | quote }}{{ end }}

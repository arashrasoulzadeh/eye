apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eye.fullname" . }}-server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: { app: {{ include "eye.fullname" . }}-server }
  template:
    metadata:
      labels: { app: {{ include "eye.fullname" . }}-server }
    spec:
      containers:
        - name: server
          image: {{ .Values.image.server }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ADMIN_KEY
              valueFrom: { secretKeyRef: { name: {{ include "eye.fullname" . }}, key: ADMIN_KEY } }
            - name: API_KEY_SALT
              valueFrom: { secretKeyRef: { name: {{ include "eye.fullname" . }}, key: API_KEY_SALT } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "eye.fullname" . }}, key: DATABASE_URL } }
            - name: DEAD_LETTER_NOTIFY_URL
              value: {{ .Values.server.deadLetterNotifyURL | quote }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "eye.fullname" . }}-server }
spec:
  selector: { app: {{ include "eye.fullname" . }}-server }
  ports: [{ name: http, port: 8080, targetPort: http }]

services:
  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["eye-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    environment:
      BROKER_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  eye-redis:

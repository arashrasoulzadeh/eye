services:
  server:
    build: { context: ., dockerfile: Dockerfile }
    command: ["/app/eye-server"]
    environment:
      EYE_ENV: production
      PORT: 8080
      DB_PATH: /data/eye.db
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BROKER_URL: ${BROKER_URL:-}
      BROKER_STREAM: ${BROKER_STREAM:-eye-events}
      BROKER_GROUP: ${BROKER_GROUP:-eye-consumers}
      BROKER_CONSUMER: ${BROKER_CONSUMER:-eye-server}
      SNAPSHOT_DIR: /data/snapshots
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      API_KEY_SALT: ${API_KEY_SALT:?set API_KEY_SALT}
      DEAD_LETTER_NOTIFY_URL: ${DEAD_LETTER_NOTIFY_URL:-}
    ports: ["8080:8080", "50052:50052"]
    volumes: ["eye-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  collector:
    build: { context: ., dockerfile: Dockerfile }
    command: ["/app/eye-collector"]
    environment:
      EYE_API_URL: ${EYE_API_URL:-}
    ports: ["50051:50051"]
    restart: unless-stopped
  admin:
    build: { context: ./admin, dockerfile: Dockerfile }
    environment:
      HOSTNAME: 0.0.0.0
      ADMIN_API_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      BACKEND_URL: http://server:8080
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      NEXT_PUBLIC_OIDC_ENABLED: ${NEXT_PUBLIC_OIDC_ENABLED:-false}
    ports: ["3003:3000"]
    depends_on: [server]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  eye-data:

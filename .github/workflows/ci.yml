name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deployment-scripts:
    name: Deployment Script Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell scripts
        run: |
          set -euo pipefail
          for script in deploy/*.sh deploy/backup/*.sh; do
            test -x "$script"
            bash -n "$script"
          done
      - name: Validate observability manifests
        run: |
          set -euo pipefail
          jq empty deploy/grafana/eye-dashboard.json
          grep -q 'EyeIntelligencePipelineFailed' deploy/prometheus/eye-intelligence-alerts.yml
          grep -q 'EyeIntelligencePipelineStuck' deploy/prometheus/eye-intelligence-alerts.yml
          grep -q 'EyeIntelligencePipelineFailed' deploy/k8s/prometheus-rules.yaml
          grep -q 'EyeIntelligencePipelineStuck' deploy/k8s/prometheus-rules.yaml

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate commit hook
        run: bash -n .githooks/pre-commit && test -x .githooks/pre-commit

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      - name: Test with coverage
        run: |
          go test ./tests/server -coverpkg=./internal/... -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        if: false
        with:
          version: v1.64

  web-sdk-test:
    name: Web SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  web-sdk-build:
    name: Web SDK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Build CDN
        run: npm run build:cdn

  admin-test:
    name: Admin Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  go-sdk-test:
    name: Go SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test
        run: go test -v

  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build
        run: mkdocs build --strict

name: Train global intelligence model
on:
  workflow_dispatch:
    inputs:
      cnn:
        description: Evaluate a temporal CNN candidate
        type: boolean
        default: true
      epochs:
        description: CNN training epochs (1–5000)
        type: number
        default: 5000

permissions:
  contents: write

concurrency:
  group: global-model-release

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch reviewed training data
        env:
          TRAINING_DATA_TOKEN: ${{ secrets.TRAINING_DATA_TOKEN }}
          TRAINING_REPO: ${{ vars.TRAINING_DATA_REPOSITORY || 'arashrasoulzadeh/eye' }}
        run: |
          repo="${TRAINING_REPO#https://github.com/}"
          repo="${repo%/}"
          repo="${repo%.git}"
          if [[ "${repo,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            exit 0
          fi
          if [[ ! "$repo" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "TRAINING_DATA_REPOSITORY must be a GitHub owner/repo or HTTPS URL." >&2
            exit 1
          fi
          if [[ -n "$TRAINING_DATA_TOKEN" ]]; then
            GH_TOKEN="$TRAINING_DATA_TOKEN" gh repo clone "$repo" "$RUNNER_TEMP/training" -- --depth=1
          else
            GIT_TERMINAL_PROMPT=0 git clone --depth=1 "https://github.com/$repo.git" "$RUNNER_TEMP/training"
          fi
          mkdir -p train/data/external
          cp -R "$RUNNER_TEMP/training/train/data/." train/data/external/
      - name: Install CPU trainer
        if: inputs.cnn
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train and publish
        env:
          GH_TOKEN: ${{ github.token }}
          EPOCHS: ${{ inputs.epochs }}
          USE_CNN: ${{ inputs.cnn }}
        run: |
          version="eye-model-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "eye-global-model.json")) | .tag_name')
          if [[ -n "$previous" ]]; then
            gh release download "${previous%%$'\n'*}" -p eye-global-model.json -O previous.json
          fi
          args=()
          if [[ "$USE_CNN" == true ]]; then args+=(--cnn); fi
          python train/train.py --version "$version" --previous previous.json --epochs "$EPOCHS" "${args[@]}"
          gh release create "$version" eye-global-model.json --target "$GITHUB_SHA" \
            --title "Eye Intelligence $version" --notes "Evaluation and schema are included in the model bundle." --latest=false

name: PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/storage/**"
      - "internal/repository/**"
      - "internal/model/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eye
          POSTGRES_USER: eye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eye -d eye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./internal/storage -run TestPostgresProductionMigrations -v
        env:
          DATABASE_URL: postgres://eye:test@localhost:5432/eye?sslmode=disable
      - name: Create non-owner application role
        run: |
          PGPASSWORD=test psql -h localhost -U eye -d eye -v ON_ERROR_STOP=1 -c "CREATE ROLE eye_app LOGIN PASSWORD 'eye-app-test' NOSUPERUSER NOCREATEDB NOCREATEROLE;" || true
          PGPASSWORD=test psql -h localhost -U eye -d eye -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE eye TO eye_app; GRANT USAGE ON SCHEMA public TO eye_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO eye_app; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO eye_app;"
      - run: go test ./internal/storage -run TestPostgresRLSRejectsCrossTenantRead -v
        env:
          DATABASE_URL: postgres://eye:test@localhost:5432/eye?sslmode=disable
          RLS_DATABASE_URL: postgres://eye_app:eye-app-test@localhost:5432/eye?sslmode=disable

name: PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/storage/**"
      - "internal/repository/**"
      - "internal/model/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eye
          POSTGRES_USER: eye
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eye -d eye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./internal/storage -run TestPostgresProductionMigrations -v
        env:
          DATABASE_URL: postgres://eye:test@localhost:5432/eye?sslmode=disable

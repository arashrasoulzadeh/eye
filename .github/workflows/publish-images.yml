name: Publish container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: arashrasoulzadeh

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eye-server
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eye-collector
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eye-aggregation-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and publish Go service images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=eye-go-images
          cache-to: type=gha,mode=max,scope=eye-go-images

      - name: Build and publish admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eye-admin:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/eye-admin:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_RELEASE=sha-${{ github.sha }}
          cache-from: type=gha,scope=eye-admin-image
          cache-to: type=gha,mode=max,scope=eye-admin-image
